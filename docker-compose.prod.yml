# Compose de produção: consome as imagens publicadas no Docker Hub pelo
# workflow de CI/CD, em vez de buildar a partir do código-fonte.
# As variáveis vêm do .env gerado na VM a cada deploy (nunca commitado).
services:
  # Nginx — proxy reverso, TLS e único ponto de entrada
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"      # validação do Let's Encrypt e redirecionamento
      - "443:443"    # a aplicação sobre TLS
      - "3000:8080"  # rota de fuga em HTTP puro, ver conf.d/default.conf
    volumes:
      # DIRETÓRIOS, e não os arquivos um a um. Bind-mount de arquivo prende
      # o INODE: quando o deploy copia uma versão nova por cima, o caminho
      # passa a apontar para um inode novo e o container segue lendo o
      # antigo, vivo só porque o mount o segura. Foi assim que este nginx
      # serviu, por dois commits, uma config que ninguém mais tinha em
      # disco — e nenhum reload consertava, porque o arquivo relido era o
      # errado. Montando o diretório, o caminho é resolvido a cada abertura
      # e a substituição é enxergada.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    # Recarrega a cada 6h para adotar o certificado renovado sem reiniciar:
    # o nginx só relê os arquivos de certificado em um reload.
    command: >
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  api-gateway:
    image: ${REGISTRY}/${GHCR_OWNER}/microservices-gateway:${IMAGE_TAG}
    restart: unless-stopped
    # Sem `ports:` — o mundo entra pelo nginx, não direto no gateway.
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      TASK_SERVICE_URL: http://task-service:3003
      ESTUDO_SERVICE_URL: http://estudo-service:3004
      REDIS_URL: redis://redis:6379
    depends_on:
      - auth-service
      - user-service
      - task-service
      - estudo-service
      - redis
    networks:
      - microservices-network

  auth-service:
    image: ${REGISTRY}/${GHCR_OWNER}/microservices-auth-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  user-service:
    image: ${REGISTRY}/${GHCR_OWNER}/microservices-user-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  task-service:
    image: ${REGISTRY}/${GHCR_OWNER}/microservices-task-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: task_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  questoes-service:
    image: ${REGISTRY}/${GHCR_OWNER}/microservices-questoes-service:${IMAGE_TAG}
    restart: unless-stopped
    # Sem `ports:` — o mundo entra pelo nginx, não direto no serviço.
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: questoes_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  estudo-service:
    image: ${REGISTRY}/${GHCR_OWNER}/microservices-estudo-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: estudo_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  # Renovação automática do certificado. Let's Encrypt dura 90 dias; sem
  # isto o HTTPS quebra sozinho. Verifica a cada 12h e só age quando falta
  # menos de 30 dias, que é o comportamento padrão do `certbot renew`.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/certs:/certs
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        cp /etc/letsencrypt/live/163-176-30-179.sslip.io/fullchain.pem /certs/fullchain.pem 2>/dev/null || true;
        cp /etc/letsencrypt/live/163-176-30-179.sslip.io/privkey.pem /certs/privkey.pem 2>/dev/null || true;
        chmod 644 /certs/fullchain.pem 2>/dev/null || true;
        chmod 600 /certs/privkey.pem 2>/dev/null || true;
        sleep 12h & wait $${!};
      done'
    depends_on:
      - nginx
    networks:
      - microservices-network

  # Backup diário dos três bancos. Fica no mesmo host do Postgres, o que
  # protege contra erro humano e corrupção lógica — mas não contra perda da
  # VM. Cópia fora da máquina continua sendo o passo seguinte.
  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD}
      RETENCAO_DIAS: 7
    volumes:
      - ./backups:/backups
      # Diretório pelo mesmo motivo do nginx: montado como arquivo, este
      # container rodaria para sempre a versão do script que existia no dia
      # em que ele foi criado, e toda correção no backup passaria a impressão
      # de ter sido aplicada.
      - ./scripts:/scripts:ro
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        sh /scripts/backup.sh || echo "backup falhou";
        sleep 24h & wait $${!};
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    # Sem `ports:` — o banco só é alcançável pela rede interna do compose.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: microservices_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Este continua como arquivo de propósito: só é lido quando o volume
      # está vazio, ou seja, na primeira criação do container — quando o
      # inode montado é necessariamente o atual. Trocá-lo por diretório
      # exigiria mover o arquivo sem resolver problema nenhum.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sem `ports:` — idem.
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
