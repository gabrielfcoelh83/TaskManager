# ── CORS: origens autorizadas ────────────────────────────────────────
# O front é servido pela Vercel, a API roda aqui: origens diferentes.
# Lista explícita em vez de "*", porque "*" é incompatível com envio de
# credenciais e devolveria a mesma resposta para qualquer site.
map $http_origin $cors_origin {
    default                          "";
    "https://ml-direito.vercel.app"  $http_origin;
    "http://localhost:5173"          $http_origin;   # vite dev
}

# Preflight não deve consumir cota de rate limit: o navegador dispara um
# OPTIONS antes de cada POST, então contá-lo derrubaria o limite pela
# metade. Chave vazia faz o limit_req ignorar a requisição.
map $request_method $chave_auth {
    OPTIONS  "";
    default  $binary_remote_addr;
}
map $request_method $chave_geral {
    OPTIONS  "";
    default  $binary_remote_addr;
}

# Limite por IP para as rotas de autenticação. Sem isso, /login aceita
# tentativas de senha na velocidade que a rede permitir — e o bcrypt,
# que é caro de propósito, vira o gargalo que derruba o serviço.
limit_req_zone $chave_auth  zone=auth:10m  rate=5r/s;
limit_req_zone $chave_geral zone=geral:10m rate=30r/s;

# O nginx enxerga o IP do cliente; o gateway enxerga o IP do nginx.
# Sem repassar, todo log da aplicação mostraria o mesmo endereço.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ── Porta 80: validação do Let's Encrypt e redirecionamento ──────────
server {
    listen 80;
    server_name _;
    server_tokens off;

    # O desafio HTTP-01 precisa ser servido em texto puro, sem redirecionar.
    # O certbot grava o arquivo aqui; o nginx apenas o entrega.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Porta 443: a aplicação sobre TLS ─────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Enquanto o certificado do Let's Encrypt não existe, o nginx sobe com
    # o autoassinado gerado no bootstrap. Sem isso ele se recusaria a
    # iniciar, e um proxy que não sobe derruba a aplicação inteira.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/proxy.conf;
}

# ── Porta 8080: rota de fuga em HTTP puro ────────────────────────────
# Publicada no host como 3000. Existe para que uma falha no TLS, ou a
# porta 443 ainda fechada na VCN, não deixem a aplicação inalcançável.
# Pode ser removida assim que o HTTPS estiver estável.
server {
    listen 8080;
    server_name _;

    include /etc/nginx/snippets/proxy.conf;
}
