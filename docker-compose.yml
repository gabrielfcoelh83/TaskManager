services:
  # Nginx — proxy reverso e único ponto de entrada
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # 3000 continua atendendo, agora pelo nginx: nada que já apontava
      # para essa porta quebra. Pode ser removido quando a VCN liberar a 80.
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  # API Gateway - Ponto de entrada único
  api-gateway:
    build: ./gateway
    # Sem `ports:` — o mundo entra pelo nginx, não direto no gateway.
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      TASK_SERVICE_URL: http://task-service:3003
      REDIS_URL: redis://redis:6379
    depends_on:
      - auth-service
      - user-service
      - task-service
      - redis
    networks:
      - microservices-network

  # Serviço de Autenticação
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Serviço de Usuários
  user-service:
    build: ./user-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:3001
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Serviço de Tarefas
  task-service:
    build: ./task-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: task_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    # Sem `ports:` — acessivel apenas pela rede interna do compose.
    # Para acesso local use: docker compose exec postgres psql -U postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: microservices_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network

  # Redis para Cache e Message Broker
  redis:
    image: redis:7-alpine
    # Sem `ports:` — acessivel apenas pela rede interna do compose.
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
