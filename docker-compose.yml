services:
  # Nginx — proxy reverso, TLS e único ponto de entrada
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"      # validação do Let's Encrypt e redirecionamento
      - "443:443"    # a aplicação sobre TLS
      - "3000:8080"  # rota de fuga em HTTP puro, ver conf.d/default.conf
    volumes:
      # Diretórios, não arquivos: ver a explicação em docker-compose.prod.yml.
      # Em dev o efeito é o mesmo — editar a config e não ver mudança nenhuma.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    # Recarrega a cada 6h para adotar o certificado renovado sem reiniciar:
    # o nginx só relê os arquivos de certificado em um reload.
    command: >
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  # API Gateway - Ponto de entrada único
  api-gateway:
    build: ./gateway
    # Sem `ports:` — o mundo entra pelo nginx, não direto no gateway.
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      TASK_SERVICE_URL: http://task-service:3003
      ESTUDO_SERVICE_URL: http://estudo-service:3004
      REDIS_URL: redis://redis:6379
    depends_on:
      - auth-service
      - user-service
      - task-service
      - redis
    networks:
      - microservices-network

  # Serviço de Autenticação
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Serviço de Usuários
  user-service:
    build: ./user-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Serviço de Tarefas
  task-service:
    build: ./task-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: task_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Renovação automática do certificado. Let's Encrypt dura 90 dias; sem
  # isto o HTTPS quebra sozinho. Verifica a cada 12h e só age quando falta
  # menos de 30 dias, que é o comportamento padrão do `certbot renew`.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/certs:/certs
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        cp /etc/letsencrypt/live/163-176-30-179.sslip.io/fullchain.pem /certs/fullchain.pem 2>/dev/null || true;
        cp /etc/letsencrypt/live/163-176-30-179.sslip.io/privkey.pem /certs/privkey.pem 2>/dev/null || true;
        chmod 644 /certs/fullchain.pem 2>/dev/null || true;
        chmod 600 /certs/privkey.pem 2>/dev/null || true;
        sleep 12h & wait $${!};
      done'
    depends_on:
      - nginx
    networks:
      - microservices-network

  # Banco de Dados PostgreSQL
  # Backup diário dos três bancos. Fica no mesmo host do Postgres, o que
  # protege contra erro humano e corrupção lógica — mas não contra perda da
  # VM. Cópia fora da máquina continua sendo o passo seguinte.
  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD}
      RETENCAO_DIAS: 7
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        sh /backup.sh || echo "backup falhou";
        sleep 24h & wait $${!};
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  estudo-service:
    build: ./estudo-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: estudo_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    # Sem REDIS_URL: este serviço ainda não publica nem consome evento.
    # Declarar dependência que não existe atrasa o arranque sem motivo.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  postgres:
    image: postgres:15-alpine
    # Sem `ports:` — acessivel apenas pela rede interna do compose.
    # Para acesso local use: docker compose exec postgres psql -U postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: microservices_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network

  # Redis para Cache e Message Broker
  redis:
    image: redis:7-alpine
    # Sem `ports:` — acessivel apenas pela rede interna do compose.
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
