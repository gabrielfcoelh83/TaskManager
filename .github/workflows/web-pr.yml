name: Web PR Checks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - '!apps/web/**.md'
      # O e2e constrói o backend de apps/api: mudança lá também testa o front.
      - 'apps/api/**'
      - '!apps/api/**.md'
      - '.github/workflows/web-pr.yml'

# `run:` roda dentro de apps/web. Caminhos de `with:` (cache-dependency-path,
# path de artefato) são relativos à RAIZ, por isso levam apps/web/ por extenso.
defaults:
  run:
    working-directory: apps/web

jobs:
  check-code:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de lib
        run: npm run test:lib

      - name: Build check
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Gerar segredo efêmero do backend E2E
        run: echo "E2E_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Subir o backend (auth + estudo + gateway)
        run: ./scripts/e2e-backend.sh

      # ⚠️ continue-on-error deixa este passo incapaz de reprovar o check. Quem
      # de fato barra o PR é o job test-e2e do web.yml. Mantido como estava para
      # não mudar a política de merge junto com a mudança de infra.
      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Derrubar o backend
        if: always()
        run: ./scripts/e2e-backend.sh down

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      - name: Comment results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ PR checks completed!\n- Linting\n- Testes de lib\n- Build\n- E2E tests\n- Security audit'
            })
