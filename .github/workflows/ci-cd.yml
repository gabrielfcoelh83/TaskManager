name: CI/CD

on:
  push:
    branches: [main]
    # Mudança só de documentação não justifica rebuildar as imagens nem
    # reiniciar a stack em produção. workflow_dispatch continua disponível
    # para forçar uma execução quando necessário.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: microservices

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Verificação de vulnerabilidades
  # ────────────────────────────────────────────────────────────
  audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, user-service, task-service, estudo-service, questoes-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Os package-lock.json são versionados, então `npm audit` roda direto,
      # sem resolver nem instalar nada. A checagem de lockfile fora de
      # sincronia com o package.json fica por conta do `npm ci` no build.
      - name: Auditar dependências
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

      # Relatório legível mesmo quando o passo acima falha.
      - name: Relatório de vulnerabilidades
        if: always()
        working-directory: ${{ matrix.service }}
        run: npm audit --json > audit-${{ matrix.service }}.json || true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.service }}
          path: ${{ matrix.service }}/audit-${{ matrix.service }}.json
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # 2. Testes de integração contra Postgres e Redis reais
  # ────────────────────────────────────────────────────────────
  test:
    name: Testes (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: audit

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            db: auth_db
          - service: user-service
            db: user_db
          - service: estudo-service
            db: estudo_db
          - service: questoes-service
            db: questoes_db

    # Bancos de verdade, não mocks: hash de senha, constraint de unicidade
    # e autorização por dono são justamente onde mock esconderia o erro.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Criar schema
        env:
          PGPASSWORD: teste
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f init.sql

      - name: Instalar dependências
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Rodar testes
        working-directory: ${{ matrix.service }}
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ matrix.db }}
          DB_USER: postgres
          DB_PASSWORD: teste
          JWT_SECRET: segredo-de-teste
          REDIS_URL: redis://localhost:6379
        run: npm test

  # ────────────────────────────────────────────────────────────
  # 3. Build da imagem Docker + push para o GitHub Container Registry
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [audit, test]
    # Pull requests passam pela auditoria mas não publicam imagens.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      # packages: write autoriza o GITHUB_TOKEN a publicar no ghcr.io.
      # É o que dispensa DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, user-service, task-service, estudo-service, questoes-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ────────────────────────────────────────────────────────────
  # 4. Deploy na VM Oracle Cloud via SSH
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Oracle Cloud)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      # packages: read permite que a VM puxe as imagens do ghcr.io usando
      # o GITHUB_TOKEN desta execução, sem depender de o pacote ser público.
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave SSH
        env:
          KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Secret em base64 (linha única): imune a quebras de linha
          # perdidas na colagem, que é o que quebrou o deploy anterior.
          echo "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Falha cedo e com mensagem clara se a chave não for válida.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY_B64 inválido ou truncado"; exit 1; }
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar arquivos de orquestração
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/microservices-project"
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" -r \
            docker-compose.prod.yml init.sql nginx scripts \
            "$SSH_USER@$SSH_HOST:~/microservices-project/"

      - name: Subir a stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            REGISTRY="$REGISTRY" \
            GHCR_OWNER="$GHCR_OWNER" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            IMAGE_TAG="$IMAGE_TAG" \
            DB_PASSWORD="$DB_PASSWORD" \
            JWT_SECRET="$JWT_SECRET" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/microservices-project

          # O .env fica só na VM, gerado a cada deploy a partir dos
          # secrets do GitHub. Nunca é commitado.
          umask 077
          cat > .env <<EOF
          REGISTRY=${REGISTRY}
          GHCR_OWNER=${GHCR_OWNER}
          IMAGE_TAG=${IMAGE_TAG}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          EOF

          # Pacotes no ghcr.io nascem privados. O GITHUB_TOKEN desta execução
          # autoriza o pull e expira junto com ela; o logout no fim evita
          # deixar credencial em ~/.docker/config.json.
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          trap 'docker logout "$REGISTRY" > /dev/null 2>&1 || true' EXIT

          # O nginx não inicia um bloco 443 sem certificado no lugar.
          # Só cria se não houver — nunca sobrescreve o do Let's Encrypt.
          chmod +x scripts/*.sh
          # Criados aqui para pertencerem ao usuário; se o Docker os criar
          # ao montar, vêm como root e o backup falha ao escrever.
          mkdir -p backups
          DOMINIO=163-176-30-179.sslip.io ./scripts/bootstrap-cert.sh

          docker compose -f docker-compose.prod.yml pull

          # A config do nginx é testada num container DESCARTÁVEL, montando
          # exatamente os arquivos que acabaram de chegar. `exec nginx -t` no
          # container em pé testaria o que ele já tem, que é justamente o que
          # não se quer saber. Aqui um erro de sintaxe reprova o deploy antes
          # de qualquer imagem ser trocada, com a produção intacta.
          docker run --rm \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

          # O nginx vem antes do resto, e não junto, porque quem responde o
          # CORS é ele: subir o gateway novo primeiro abriria uma janela em
          # que nenhum dos dois responde o cabeçalho e o front tomaria erro.
          # `--no-deps` para não arrastar o gateway junto pelo depends_on.
          docker compose -f docker-compose.prod.yml up -d --no-deps nginx

          # `up -d` só recria o container quando a DEFINIÇÃO muda; mudança de
          # conteúdo de arquivo montado não conta, e sem este reload a config
          # nova ficaria em disco sem nunca entrar em vigor. Recarregar um
          # nginx recém-criado é inofensivo, então não vale ramificar.
          # `< /dev/null` NÃO é decoração. O script inteiro chega neste shell
          # pela stdin (`ssh 'bash -s' <<REMOTE`), e `exec -T` repassa a stdin
          # para o container — sem redirecionar, ele ENGOLE o resto do script.
          # Foi o que aconteceu: dois deploys terminaram verdes tendo parado
          # exatamente aqui, sem nunca rodar o `up -d` que sobe os serviços.
          docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload < /dev/null

          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f

          # Sobras do layout antigo, quando nginx.conf e proxy.conf eram
          # montados um a um. O scp não apaga o que saiu do repositório, e um
          # arquivo de config que não é mais lido por ninguém é exatamente o
          # tipo de pista falsa que custou caro aqui. Linha descartável assim
          # que nenhuma VM tiver mais o layout antigo.
          rm -f nginx/nginx.conf nginx/proxy.conf
          REMOTE

      - name: Smoke test
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/microservices-project

          echo "Aguardando a stack responder..."
          ESTADO=""
          for i in $(seq 1 30); do
            # HTTPS, não HTTP: a porta 80 só redireciona, e um 301 faria
            # o curl sair com sucesso sem ter verificado coisa alguma.
            # -k porque o certificado pode ainda ser o autoassinado; aqui
            # o alvo é a cadeia proxy -> gateway -> serviços, não a PKI.
            if curl -fsSk https://localhost/nginx-health > /dev/null \
               && curl -fsSk https://localhost/health > /dev/null; then
              # /health é só o gateway falando de si mesmo, e
              # /health/services responde 200 mesmo com serviço DOWN — o
              # corpo é que carrega o veredito. Sem olhar para ele, um
              # serviço em crash loop passaria por deploy bem-sucedido.
              ESTADO=$(curl -fsSk https://localhost/health/services || echo "")
              if [ -n "$ESTADO" ] && ! printf '%s' "$ESTADO" | grep -q 'DOWN'; then
                echo "nginx (TLS), gateway e serviços UP"
                printf '%s\n' "$ESTADO"

                # Um deploy que não aplicou é indistinguível de um deploy bom
                # olhando só para a saúde: os serviços ANTIGOS respondem
                # perfeitamente. Dois deploys seguidos passaram verdes sem
                # trocar imagem nenhuma. Comparar o que roda com o que foi
                # implantado é a única checagem que enxerga isso.
                ESPERADA=$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
                DIVERGENTES=""
                for s in api-gateway auth-service user-service task-service estudo-service questoes-service; do
                  RODANDO=$(docker compose -f docker-compose.prod.yml ps -q "$s" 2>/dev/null \
                    | xargs -r docker inspect --format '{{.Config.Image}}' 2>/dev/null \
                    | sed 's/.*://')
                  if [ "$RODANDO" != "$ESPERADA" ]; then
                    DIVERGENTES="$DIVERGENTES $s(${RODANDO:-ausente})"
                  fi
                done
                if [ -n "$DIVERGENTES" ]; then
                  echo "::error::Deploy não aplicou. Esperada $ESPERADA, mas:$DIVERGENTES"
                  exit 1
                fi
                echo "todos os serviços rodando a tag $ESPERADA"

                # CORS é a única parte desta stack que só quebra no
                # navegador: o curl não liga para o cabeçalho, e
                # /health/services responde igual com ele certo, errado ou
                # ausente. Foi por isso que uma config inerte sobreviveu a
                # todos os deploys — nada nunca olhou. Aqui ela vira porta:
                # deploy que derruba o front não vira "última versão boa".
                CABECALHOS=$(curl -fsSk -o /dev/null -D - \
                  -H 'Origin: https://ml-direito.vercel.app' \
                  https://localhost/health || echo "")
                ORIGENS=$(printf '%s' "$CABECALHOS" \
                  | grep -ci '^access-control-allow-origin:' || true)
                CERTA=$(printf '%s' "$CABECALHOS" \
                  | grep -ci '^access-control-allow-origin: *https://ml-direito.vercel.app' || true)

                # Duas checagens, não uma: zero significa front sem acesso,
                # e dois significa front igualmente sem acesso — o navegador
                # recusa resposta com o cabeçalho repetido. Só "exatamente
                # um, e o certo" serve.
                if [ "$ORIGENS" != "1" ] || [ "$CERTA" != "1" ]; then
                  echo "::error::CORS quebrado: $ORIGENS cabeçalhos Allow-Origin, $CERTA com a origem esperada."
                  printf '%s\n' "$CABECALHOS" | grep -i '^access-control' || echo "(nenhum)"
                  exit 1
                fi
                echo "CORS: um Access-Control-Allow-Origin, com a origem do front"

                # Só aqui a tag é promovida a "última boa": depois de a stack
                # ter provado que sobe e responde. É o que torna o rollback
                # confiável — .last_good_tag nunca aponta para algo não testado.
                grep '^IMAGE_TAG=' .env | cut -d= -f2 > .last_good_tag
                echo "Tag registrada como última boa: $(cat .last_good_tag)"
                exit 0
              fi
            fi
            sleep 2
          done

          # Serviço que nunca subiu é indistinguível de serviço lento até o
          # tempo acabar; por isso a espera vale para os dois casos e o
          # diagnóstico só aparece aqui.
          echo "::error::A stack não ficou saudável em 60s."
          if [ -n "$ESTADO" ]; then
            echo "Último /health/services: $ESTADO"
          else
            echo "nginx ou gateway não responderam."
          fi
          docker compose -f docker-compose.prod.yml logs --tail=50
          exit 1
          REMOTE

      - name: Rollback para a última versão boa
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            REGISTRY="$REGISTRY" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/microservices-project

          if [ ! -f .last_good_tag ]; then
            echo "::error::Nenhum deploy bom registrado — não há para onde voltar."
            echo "A stack pode ter ficado num estado intermediário; verifique manualmente:"
            docker compose -f docker-compose.prod.yml ps || true
            exit 1
          fi

          GOOD=$(cat .last_good_tag)
          ATUAL=$(grep '^IMAGE_TAG=' .env | cut -d= -f2 || echo "")

          if [ "$GOOD" = "$ATUAL" ]; then
            echo "A stack já roda a última versão boa ($GOOD); nada a reverter."
            exit 0
          fi

          echo "Revertendo de $ATUAL para $GOOD"
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$GOOD/" .env
          # A imagem antiga costuma estar em cache local, mas o pull garante
          # o caso em que foi removida. Sem login ele falharia em silêncio.
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          trap 'docker logout "$REGISTRY" > /dev/null 2>&1 || true' EXIT
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Um rollback que não é verificado é só mais um deploy no escuro —
          # e o critério tem de ser o mesmo do smoke test, senão a versão
          # "boa" é aprovada por uma régua mais frouxa que a que reprovou a nova.
          echo "Verificando a versão revertida..."
          ESTADO=""
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost/health > /dev/null; then
              ESTADO=$(curl -fsSk https://localhost/health/services || echo "")
              if [ -n "$ESTADO" ] && ! printf '%s' "$ESTADO" | grep -q 'DOWN'; then
                echo "Rollback concluído: rodando $GOOD"
                printf '%s\n' "$ESTADO"
                exit 0
              fi
            fi
            sleep 2
          done

          if [ -n "$ESTADO" ]; then
            echo "Último /health/services: $ESTADO"
          fi
          echo "::error::O rollback para $GOOD também não ficou saudável. Logs:"
          docker compose -f docker-compose.prod.yml logs --tail=50
          exit 1
          REMOTE
