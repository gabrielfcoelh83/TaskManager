name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: microservices

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Verificação de vulnerabilidades
  # ────────────────────────────────────────────────────────────
  audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, user-service, task-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Este projeto ainda não versiona package-lock.json, e `npm audit`
      # exige um lockfile. Resolvemos a árvore de dependências sem instalar
      # nada. Quando os lockfiles forem commitados, troque este passo por
      # `npm ci` e reative o cache do setup-node.
      - name: Resolver árvore de dependências
        working-directory: ${{ matrix.service }}
        run: npm install --package-lock-only

      - name: Auditar dependências
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

      # Relatório legível mesmo quando o passo acima falha.
      - name: Relatório de vulnerabilidades
        if: always()
        working-directory: ${{ matrix.service }}
        run: npm audit --json > audit-${{ matrix.service }}.json || true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.service }}
          path: ${{ matrix.service }}/audit-${{ matrix.service }}.json
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # 2. Build da imagem Docker + push para o Docker Hub
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: audit
    # Pull requests passam pela auditoria mas não publicam imagens.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, user-service, task-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ────────────────────────────────────────────────────────────
  # 3. Deploy na VM Oracle Cloud via SSH
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Oracle Cloud)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Enviar arquivos de orquestração
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml,init.sql
          target: ~/microservices-project
          overwrite: true

      - name: Subir a stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG,DB_PASSWORD,JWT_SECRET
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/microservices-project

            # O .env fica só na VM, gerado a cada deploy a partir dos
            # secrets do GitHub. Nunca é commitado.
            umask 077
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            IMAGE_TAG=${IMAGE_TAG}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            EOF

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "Aguardando o gateway responder..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000/health > /dev/null; then
                echo "Gateway UP"
                curl -fsS http://localhost:3000/health/services
                exit 0
              fi
              sleep 2
            done

            echo "Gateway não respondeu em 60s. Logs:"
            cd ~/microservices-project
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1

      - name: Rollback para a imagem anterior
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.before }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/microservices-project
            echo "Deploy falhou — voltando para ${IMAGE_TAG}"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.prod.yml up -d
