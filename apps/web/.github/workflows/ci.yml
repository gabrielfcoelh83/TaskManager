name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint & Format
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

  # Job 2: E2E + API Tests
  test-e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # A suíte exerce login e gravação de verdade desde que as tentativas
      # saíram do localStorage. Sobe o mesmo backend que roda em produção, a
      # partir das imagens publicadas pelo pipeline da plataforma — mockar aqui
      # esconderia justamente o que estes testes verificam.
      - name: Subir o backend (auth + estudo + gateway)
        run: ./scripts/e2e-backend.sh

      # O dev server (porta 5173) é iniciado pelo webServer do playwright.config.js
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Sem isto, uma falha de teste vira "elemento não encontrado" sem pista
      # de que a causa foi um serviço que não subiu.
      - name: Logs do backend (só quando falha)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=50

      - name: Derrubar o backend
        if: always()
        run: ./scripts/e2e-backend.sh down

      - name: Run API tests
        run: |
          node server/dev-api.js &
          sleep 2
          npm run test:api
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # Job 3: Build
  build:
    runs-on: ubuntu-latest
    needs: [lint, test-e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

# QUEM PUBLICA
#
# A integração Git da Vercel, ligada ao repositório — não este workflow.
#
# Havia aqui um job `deploy` que rodava `vercel deploy --prod` com um
# VERCEL_TOKEN dos secrets, e que era condicional: sem o token, imprimia
# "pulando deploy" e SAÍA COM SUCESSO. Sem o token configurado, o resultado
# era o pior possível — pipeline verde, nenhum alerta, e produção parada no
# tempo por semanas. A quebra de imports que derrubou o build só não afetou
# ninguém porque nada era publicado mesmo.
#
# Um passo que falha em silêncio é pior que passo nenhum: ele produz a
# aparência de deploy sem o deploy. Com a integração Git, publicar deixa de
# depender de segredo que pode faltar, e um deploy que não sai aparece no
# painel da Vercel como falha, não como sucesso.
#
# O que este workflow ainda faz importa: lint, e2e e build precisam continuar
# barrando o que estiver quebrado antes de virar commit em main.
#
# As variáveis de build agora vivem no painel da Vercel (Settings →
# Environment Variables), não nos secrets do GitHub. VITE_API_URL é a que não
# pode faltar: ela entra no bundle em tempo de build, e sem ela o front chama
# a própria origem da Vercel, onde nenhuma rota da API responde.
