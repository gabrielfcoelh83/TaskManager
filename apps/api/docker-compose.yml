services:
  # Nginx — proxy reverso, TLS e único ponto de entrada
  nginx:
    image: nginx:1.27-alpine
    # Toda porta deste compose (o de dev) vai presa ao loopback. Sem o
    # `127.0.0.1:` o Docker publica em 0.0.0.0 por DNAT, por fora do firewall
    # do host: a stack de dev ficava alcançável por qualquer máquina da rede —
    # com o override (NODE_ENV=test) criando conta já ativada, e com os
    # serviços na 3001–3005 sem o `limit_req` do nginx na frente. Quem usa
    # estas portas (o proxy do Vite, o gateway rodando fora do Docker) está
    # na mesma máquina. O compose de produção publica só 80/443, de propósito.
    ports:
      - "127.0.0.1:80:80"      # validação do Let's Encrypt e redirecionamento
      - "127.0.0.1:443:443"    # a aplicação sobre TLS
      - "127.0.0.1:3000:8080"  # rota de fuga em HTTP puro, ver conf.d/default.conf
    volumes:
      # Diretórios, não arquivos: ver a explicação em docker-compose.prod.yml.
      # Em dev o efeito é o mesmo — editar a config e não ver mudança nenhuma.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    # Recarrega a cada 6h para adotar o certificado renovado sem reiniciar:
    # o nginx só relê os arquivos de certificado em um reload.
    command: >
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  # API Gateway - Ponto de entrada único
  api-gateway:
    build: ./gateway
    # Sem `ports:` — o mundo entra pelo nginx, não direto no gateway.
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      ESTUDO_SERVICE_URL: http://estudo-service:3004
      QUESTOES_SERVICE_URL: http://questoes-service:3005
      REDIS_URL: redis://redis:6379
    depends_on:
      - auth-service
      - user-service
      - estudo-service
      - questoes-service
      - redis
    networks:
      - microservices-network

  # Serviço de Autenticação
  auth-service:
    build: ./auth-service
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      # Padrões de DEV, não de produção: sem .env, links de e-mail e o
      # callback do Google apontam para esta máquina, nunca para
      # api.mlkoab.tech. O remetente onboarding@resend.dev é o de teste do
      # Resend, aceito sem domínio verificado. Produção recebe os valores
      # reais do workflow (apps/api/docker-compose.prod.yml + api.yml).
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:3000/api/calendar/google/callback}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Serviço de Usuários
  user-service:
    build: ./user-service
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-network

  # Renovação automática do certificado. Let's Encrypt dura 90 dias; sem
  # isto o HTTPS quebra sozinho. Verifica a cada 12h e só age quando falta
  # menos de 30 dias, que é o comportamento padrão do `certbot renew`.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/certs:/certs
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        cp /etc/letsencrypt/live/api.mlkoab.tech/fullchain.pem /certs/fullchain.pem 2>/dev/null || true;
        cp /etc/letsencrypt/live/api.mlkoab.tech/privkey.pem /certs/privkey.pem 2>/dev/null || true;
        chmod 644 /certs/fullchain.pem 2>/dev/null || true;
        chmod 600 /certs/privkey.pem 2>/dev/null || true;
        sleep 12h & wait $${!};
      done'
    depends_on:
      - nginx
    networks:
      - microservices-network

  # Banco de Dados PostgreSQL
  # Backup diário dos quatro bancos. Fica no mesmo host do Postgres, o que
  # protege contra erro humano e corrupção lógica — mas não contra perda da
  # VM. Cópia fora da máquina continua sendo o passo seguinte.
  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RETENCAO_DIAS: 7
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        sh /backup.sh || echo "backup falhou";
        sleep 24h & wait $${!};
      done'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  questoes-service:
    build: ./questoes-service
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: questoes_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  estudo-service:
    build: ./estudo-service
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: estudo_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    # Sem REDIS_URL: este serviço ainda não publica nem consome evento.
    # Declarar dependência que não existe atrasa o arranque sem motivo.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  postgres:
    image: postgres:15-alpine
    # Sem `ports:` — acessivel apenas pela rede interna do compose.
    # Para acesso local use: docker compose exec postgres psql -U postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: microservices_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network

  # Redis para Cache e Message Broker
  redis:
    image: redis:7-alpine
    # Sem `ports:` — acessivel apenas pela rede interna do compose.
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
