name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: microservices

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Verificação de vulnerabilidades
  # ────────────────────────────────────────────────────────────
  audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, user-service, task-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Este projeto ainda não versiona package-lock.json, e `npm audit`
      # exige um lockfile. Resolvemos a árvore de dependências sem instalar
      # nada. Quando os lockfiles forem commitados, troque este passo por
      # `npm ci` e reative o cache do setup-node.
      - name: Resolver árvore de dependências
        working-directory: ${{ matrix.service }}
        run: npm install --package-lock-only

      - name: Auditar dependências
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

      # Relatório legível mesmo quando o passo acima falha.
      - name: Relatório de vulnerabilidades
        if: always()
        working-directory: ${{ matrix.service }}
        run: npm audit --json > audit-${{ matrix.service }}.json || true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.service }}
          path: ${{ matrix.service }}/audit-${{ matrix.service }}.json
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # 2. Build da imagem Docker + push para o Docker Hub
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: audit
    # Pull requests passam pela auditoria mas não publicam imagens.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, user-service, task-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ────────────────────────────────────────────────────────────
  # 3. Deploy na VM Oracle Cloud via SSH
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Oracle Cloud)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave SSH
        env:
          KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Secret em base64 (linha única): imune a quebras de linha
          # perdidas na colagem, que é o que quebrou o deploy anterior.
          echo "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Falha cedo e com mensagem clara se a chave não for válida.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY_B64 inválido ou truncado"; exit 1; }
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar arquivos de orquestração
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/microservices-project"
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            docker-compose.prod.yml init.sql \
            "$SSH_USER@$SSH_HOST:~/microservices-project/"

      - name: Subir a stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            IMAGE_TAG="$IMAGE_TAG" \
            DB_PASSWORD="$DB_PASSWORD" \
            JWT_SECRET="$JWT_SECRET" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/microservices-project

          # O .env fica só na VM, gerado a cada deploy a partir dos
          # secrets do GitHub. Nunca é commitado.
          umask 077
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          IMAGE_TAG=${IMAGE_TAG}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          EOF

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          REMOTE

      - name: Smoke test
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Aguardando o gateway responder..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "Gateway UP"
              curl -fsS http://localhost:3000/health/services
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Gateway não respondeu em 60s. Logs:"
          cd ~/microservices-project
          docker compose -f docker-compose.prod.yml logs --tail=50
          exit 1
          REMOTE
