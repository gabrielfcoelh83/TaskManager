# Configuração compartilhada pelos server blocks que servem a aplicação.
# Mantida em arquivo separado para não divergir entre HTTP e HTTPS.

server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# O gateway também responde CORS (o `cors()` do Express). Se os dois
# falarem, a resposta sai com DOIS Access-Control-Allow-Origin e o
# navegador recusa a resposta inteira — o front quebra por excesso de
# permissão, não por falta. Aqui o cabeçalho do upstream é descartado e
# quem decide a origem é só o nginx, que é onde a lista mora.
#
# Fica no nível do server, e não repetido dentro de cada location, porque
# proxy_hide_header É herdado: ao contrário do add_header logo acima,
# nenhuma location o redefine, então todas recebem este. Só é seguro
# apagar esta linha quando nenhuma versão do gateway com `cors()` puder
# mais ser servida — inclusive por rollback.
proxy_hide_header Access-Control-Allow-Origin;

client_max_body_size 1m;

gzip on;
gzip_types application/json text/plain;
gzip_min_length 256;

# 127.0.0.11 é o DNS interno do Docker. Resolver em tempo de requisição,
# e não no arranque, resolve dois problemas: o nginx sobe mesmo com o
# gateway fora do ar, e acompanha a troca de IP quando o deploy recria
# o container — com upstream estático ele serviria 502 até reiniciar.
resolver 127.0.0.11 valid=10s ipv6=off;
set $gateway "api-gateway:3000";

# Health check do próprio nginx: responde mesmo com o gateway fora do ar,
# o que permite distinguir "proxy caiu" de "aplicação caiu".
location = /nginx-health {
    access_log off;
    return 200 "nginx ok\n";
    add_header Content-Type text/plain;
}

location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;

    # ⚠️ add_header dentro de location DESCARTA os herdados do server —
    # por isso os de segurança reaparecem aqui. Omiti-los faria a API
    # perder nosniff/DENY sem nenhum aviso.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Vary                         Origin always;

    # Preflight: responde aqui, sem gastar uma ida ao gateway.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Vary                         Origin always;
        # PATCH está aqui porque esta lista passa a ser a única que vale:
        # até agora quem respondia o preflight era o `cors()` do gateway,
        # cujo default já inclui PATCH. No momento em que o nginx assume,
        # um método fora desta linha deixa de existir para o navegador.
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Content-Length              0;
        return 204;
    }

    # $request_uri preserva caminho e query string: com proxy_pass por
    # variável o nginx não os repassa sozinho.
    proxy_pass http://$gateway$request_uri;
    proxy_http_version 1.1;
}

location / {
    limit_req zone=geral burst=50 nodelay;
    limit_req_status 429;

    # ⚠️ add_header dentro de location DESCARTA os herdados do server —
    # por isso os de segurança reaparecem aqui. Omiti-los faria a API
    # perder nosniff/DENY sem nenhum aviso.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Vary                         Origin always;

    # Preflight: responde aqui, sem gastar uma ida ao gateway.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Vary                         Origin always;
        # PATCH está aqui porque esta lista passa a ser a única que vale:
        # até agora quem respondia o preflight era o `cors()` do gateway,
        # cujo default já inclui PATCH. No momento em que o nginx assume,
        # um método fora desta linha deixa de existir para o navegador.
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Content-Length              0;
        return 204;
    }

    proxy_pass http://$gateway$request_uri;
    proxy_http_version 1.1;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
}
