# Limite por IP para as rotas de autenticação. Sem isso, /login aceita
# tentativas de senha na velocidade que a rede permitir — e o bcrypt,
# que é caro de propósito, vira o gargalo que derruba o serviço.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=geral:10m rate=30r/s;

# O nginx enxerga o IP do cliente; o gateway enxerga o IP do nginx.
# Sem repassar, todo log da aplicação mostraria o mesmo endereço.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80;
    server_name _;

    # Não anunciar a versão do nginx nas respostas e páginas de erro.
    server_tokens off;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    # 127.0.0.11 é o DNS interno do Docker. Resolver em tempo de requisição,
    # e não no arranque, resolve dois problemas: o nginx sobe mesmo com o
    # gateway fora do ar, e acompanha a troca de IP quando o deploy recria
    # o container — com upstream estático ele serviria 502 até reiniciar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway "api-gateway:3000";

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # Health check do próprio nginx: responde mesmo com o gateway fora do ar,
    # o que permite distinguir "proxy caiu" de "aplicação caiu".
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        # $request_uri preserva caminho e query string: com proxy_pass por
        # variável o nginx não os repassa sozinho.
        proxy_pass http://$gateway$request_uri;
        proxy_http_version 1.1;
    }

    location / {
        limit_req zone=geral burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://$gateway$request_uri;
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
